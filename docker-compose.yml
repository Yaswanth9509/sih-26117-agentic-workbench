services:
  workbench:
    build: .
    container_name: mrpl-workbench
    ports:
      - "8000:8000" # FastAPI
      - "8501:8501" # Streamlit
    volumes:
      - ./data:/app/data # persist audit logs + sample docs
    environment:
      # auto = prefer local ollama, then any configured cloud key,
      # then the offline rule-based engine. Works with none of them set.
      - LLM_PROVIDER=${LLM_PROVIDER:-auto}
      # Optional cloud keys. Leave blank for a fully offline container.
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      # Reach an ollama daemon running on the HOST, not in this container.
      # Deliberately NOT ${OLLAMA_BASE_URL:-...}: that pattern lets a value
      # in .env silently win, and .env's OLLAMA_BASE_URL is for running the
      # app directly on the host (127.0.0.1) - inside this container,
      # 127.0.0.1 means the container itself, not the host, so an ollama
      # running on the host would be invisible with no error, just an
      # "unavailable" provider. This value is fixed, not overridable via
      # .env, because it is only ever correct one way from inside a container.
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - LOG_LEVEL=INFO
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
