# Streamlit configuration for the MRPL Agentic Workbench.
#
# The theme is pinned so the UI renders identically on any machine. Without
# this, Streamlit's own chrome (widget labels, metrics, expanders, st.json)
# follows the VIEWER's OS/browser theme while the app's custom CSS stays dark
# - which makes several elements unreadable on a light-mode laptop.

[theme]
base = "dark"
primaryColor = "#3b82f6"
backgroundColor = "#0f1117"
secondaryBackgroundColor = "#1e2537"
textColor = "#e2e8f0"
font = "sans serif"

[browser]
# No telemetry. This system is presented as running without external calls,
# so the UI must not phone home either.
gatherUsageStats = false

[server]
headless = true
# Serves ui/static/*  ->  <host>/app/static/*  at the Streamlit port itself.
# Used for the "How This Works" explainer, so opening it doesn't require the
# FastAPI backend to be running - it's a plain static file, not an API call.
enableStaticServing = true
