[mypy]
python_version = 3.12
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
disallow_untyped_defs = True
check_untyped_defs = True
no_implicit_optional = True
show_error_codes = True
exclude = (?x)(^build/|^dist/|^\.venv/)

# Third-party packages that ship no type information.
[mypy-sklearn.*]
ignore_missing_imports = True

[mypy-groq.*]
ignore_missing_imports = True

[mypy-streamlit.*]
ignore_missing_imports = True

# Tests use pytest fixtures and monkeypatch stubs; full annotation there adds
# noise without catching real defects in the shipped code.
[mypy-tests.*]
disallow_untyped_defs = False
